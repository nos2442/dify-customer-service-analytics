services:
  xinference:
    image: xprobe/xinference:v1.17.1-cpu
    restart: unless-stopped
    command: [xinference-local, --host, 0.0.0.0, --port, "9997"]
    ports:
      - "9997:9997"
    environment:
      XINFERENCE_HOME: /data
      XINFERENCE_MODEL_SRC: modelscope
      XINFERENCE_HEALTH_CHECK_TIMEOUT: '120'
    volumes:
      - /home/software/models:/models:ro
      - /home/software/xinference:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9997/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
