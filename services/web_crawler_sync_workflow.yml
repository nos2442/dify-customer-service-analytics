        iteration_id: each_url
        method: post
        params: ''
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        ssl_verify: true
        timeout:
          connect: 10
          read: 60
          write: 20
        title: HTTP写知识库
        type: http-request
        url: '{{#plan.write_url#}}'
      extent: parent
      height: 130
      id: write_knowledge
      parentId: each_url
      position:
        x: 2110
        y: 100
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 同步回执需再核索引和检索；未变分支没有写入。
        outputs:
        - value_selector:
          - extract_urls
          - urls
          variable: source_urls
        - value_selector:
          - each_url
          - output
          variable: creation_receipts
        title: 结束
        type: end
      height: 90
      id: end
      position:
        x: 3920
        y: 240
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config:
            api_key: '{{#env.dataset_api_key#}}'
            type: bearer
          type: api-key
        body:
          data: []
          type: none
        desc: 按URL稳定标识查询，不依赖Windows映射或人工登记。
        headers: Content-Type:application/json
        isInIteration: true
        iteration_id: each_url
        method: get
        params: 'keyword:{{#serialize.source_key#}}

          limit:100'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        ssl_verify: true
        timeout:
          connect: 10
          read: 60
          write: 20
        title: 查询原文档
        type: http-request
        url: '{{#env.dify_api_base#}}/datasets/{{#env.dataset_id#}}/documents'
      extent: parent
      height: 130
      id: lookup
      parentId: each_url
      position:
        x: 1120
        y: 100
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(lookup_status: int, lookup_body: str, source_key: str, request_body:\
          \ str,\n         source_url: str, api_base: str, dataset_id: str) -> dict:\n\
          \    import json\n    import uuid\n    value = json.loads(lookup_body)\n\
          \    if lookup_status != 200 or not isinstance(value.get('data'), list)\
          \ or value.get('has_more'):\n        raise ValueError('Incomplete document\
          \ lookup; no write attempted')\n    docs = [doc for doc in value['data']\
          \ if doc['name'].startswith(source_key + ':')]\n    if len(docs) > 1:\n\
          \        raise ValueError('Duplicate source documents require review; no\
          \ write attempted')\n    payload = json.loads(request_body)\n    action,\
          \ document_id = 'created', ''\n    if docs:\n        old = docs[0]\n   \
          \     document_id = str(uuid.UUID(old['id']))\n        if old.get('indexing_status')\
          \ != 'completed' or not old.get('enabled', True) or old.get('archived'):\n\
          \            raise ValueError('Existing source is not ready; inspect before\
          \ another write')\n        action = 'unchanged' if old['name'] == payload['name']\
          \ else 'updated'\n    path = '/documents/' + document_id + '/update-by-text'\
          \ if document_id else '/document/create-by-text'\n    receipt = {'action':\
          \ action, 'document_id': document_id, 'source_url': source_url,\n      \
          \         'content_sha256': payload['name'].rsplit(':', 1)[-1]}\n    return\
          \ {'write_required': 'no' if action == 'unchanged' else 'yes',\n       \
          \     'write_url': api_base.rstrip('/') + '/datasets/' + str(uuid.UUID(dataset_id))\
          \ + path,\n            'receipt': json.dumps(receipt, ensure_ascii=False)}\n"
        code_language: python3
        isInIteration: true
        iteration_id: each_url
        outputs:
          receipt:
            type: string
          write_required:
            type: string
          write_url:
            type: string
        title: 判定新增、变更或未变
        type: code
        variables:
        - value_selector:
          - lookup
          - status_code
          variable: lookup_status
        - value_selector:
          - lookup
          - body
          variable: lookup_body
        - value_selector:
          - serialize
          - source_key
          variable: source_key
        - value_selector:
          - serialize
          - request_body
          variable: request_body
        - value_selector:
          - each_url
          - item
          variable: source_url
        - value_selector:
          - env
          - dify_api_base
          variable: api_base
        - value_selector:
          - env
          - dataset_id
          variable: dataset_id
      extent: parent
      height: 130
      id: plan
      parentId: each_url
      position:
        x: 1450
        y: 100
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: needs-write
            value: 'yes'
            varType: string
            variable_selector:
            - plan
            - write_required
          id: 'true'
          logical_operator: and
        isInIteration: true
        iteration_id: each_url
        title: 内容需要写入？
        type: if-else
      extent: parent
      height: 130
      id: changed
      parentId: each_url
      position:
        x: 1780
        y: 100
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(write_status: int, write_body: str, planned_receipt: str)\
          \ -> dict:\n    import json\n    import uuid\n    receipt, body = json.loads(planned_receipt),\
          \ json.loads(write_body)\n    doc_id = str(uuid.UUID(body.get('document',\
          \ {}).get('id', '')))\n    if write_status != 200 or not body.get('batch'):\n\
          \        raise ValueError('Write is missing HTTP200 or indexing batch')\n\
          \    if receipt['document_id'] and receipt['document_id'] != doc_id:\n \
          \       raise ValueError('Update changed original document ID')\n    receipt.update(document_id=doc_id,\
          \ batch=body['batch'], write_http_status=write_status)\n    return {'receipt':\
          \ json.dumps(receipt, ensure_ascii=False)}\n"
        code_language: python3
        isInIteration: true
        iteration_id: each_url
        outputs:
          receipt:
            type: string
        title: 校验写入回执
        type: code
        variables:
        - value_selector:
          - write_knowledge
          - status_code
          variable: write_status
        - value_selector:
          - write_knowledge
          - body
          variable: write_body
        - value_selector:
          - plan
          - receipt
          variable: planned_receipt
      extent: parent
      height: 130
      id: validate_write
      parentId: each_url
      position:
        x: 2440
        y: 100
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        advanced_settings:
          group_enabled: false
          groups: []
        isInIteration: true
        iteration_id: each_url
        output_type: string
        title: 汇总同步回执
        type: variable-aggregator
        variables:
        - - validate_write
          - receipt
        - - plan
          - receipt
      extent: parent
      height: 130
      id: receipt
      parentId: each_url
      position:
        x: 2770
        y: 240
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
